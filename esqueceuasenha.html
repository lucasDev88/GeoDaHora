<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GeoDaHora</title>
    <link rel="stylesheet" href="./src/styleTailwindCSS/output.css">
    <link rel="stylesheet" href="./src/styles/style_LoginOauth.css">
    <link rel="icon" href="./src/assets/images/Logo_principal.jpeg">
</head>

<body>

    <div class="container">
        <div class="login-image">
            <img src="./src/assets/images/bgLogin.png" alt="Mapa">
        </div>
        <div class="login-form">
            <div class="logo">
                <img src="./src/assets/images/globo.png" alt="GeoLogo">
                <h1>GeoLogin</h1>
            </div>
            <form>
                <label for="profile">Profile</label>
                <input type="name" id="profile" placeholder="John Doe" required>

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="johndoe@example.com" required>


                <button id="btn-entrar" onclick="" type="submit">Log In</button>

                <p><a href="./index.html">Não é adm?</a></p>
                <p><a href="./dashboard.html">Sing Up</a></p>
            </form>
        </div>
    </div>

    <div class="verification">
        <h1>Verficação</h1>

        <div class="inp">
            <input class="inputs" type="text" maxlength="1">
            <input class="inputs" type="text" maxlength="1">
            <input class="inputs" type="text" maxlength="1">
            <input class="inputs" type="text" maxlength="1">
        </div>
        <p>Não pegou o código? <a href="">envie novamente</a></p>
        <p>Não é adm? a</p>
        <button>Verify</button>
    </div>

    <!-- <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script> -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="./src/js/OAuthLogin/EsqueceuASenha.js"></script>
</body>

</html>
